name: Deploy WhatsApp Birthday System

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          PYTHONPATH=$(pwd) pytest tests/unit -v
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN || 'test-token' }}

  backup-dynamodb:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Backup DynamoDB Tables (PRIVATE - Artifacts Only)
        run: |
          mkdir -p backups/dynamodb
          
          echo "📦 Backing up DynamoDB tables (will be stored as PRIVATE artifacts only)..."
          
          # Backup Birthdays table
          aws dynamodb scan \
            --table-name Birthdays \
            --region eu-west-2 \
            --output json > backups/dynamodb/birthdays-backup.json
          
          # Backup WhatsAppGroups table
          aws dynamodb scan \
            --table-name WhatsAppGroups \
            --region eu-west-2 \
            --output json > backups/dynamodb/whatsapp-groups-backup.json 2>/dev/null || echo "WhatsAppGroups not found"
          
          # Create metadata
          cat > backups/dynamodb/metadata.json << METADATA
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "warning": "PRIVATE DATA - NOT FOR PUBLIC REPO"
          }
          METADATA
          
          echo "✅ DynamoDB backups created (will be stored as private artifacts)"
          ls -lh backups/dynamodb/

      - name: Upload backup artifacts (PRIVATE - 90 days retention)
        uses: actions/upload-artifact@v4
        with:
          name: dynamodb-backups-${{ github.sha }}
          path: backups/dynamodb/
          retention-days: 90

  summary:
    needs: [test, backup-dynamodb]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "## 🎉 CI/CD Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Jobs Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- DynamoDB Backup: Created as PRIVATE artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Backups Location" >> $GITHUB_STEP_SUMMARY
          echo "- **PRIVATE GitHub Artifacts** (90 days retention)" >> $GITHUB_STEP_SUMMARY
          echo "- **NOT committed to repository**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Deploy on Server (192.168.1.66)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cd /opt/whatsapp-birthday-lambda" >> $GITHUB_STEP_SUMMARY
          echo "git pull origin main" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose build" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
