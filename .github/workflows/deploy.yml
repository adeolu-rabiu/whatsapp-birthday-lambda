name: Deploy WhatsApp Birthday System

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          PYTHONPATH=$(pwd) pytest tests/unit -v
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN || 'test-token' }}

  backup-dynamodb:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Backup DynamoDB Tables
        run: |
          mkdir -p backups/dynamodb
          
          echo "📦 Backing up DynamoDB tables..."
          
          # Backup Birthdays table
          aws dynamodb scan \
            --table-name Birthdays \
            --region eu-west-2 \
            --output json > backups/dynamodb/birthdays-backup-$(date +%Y%m%d-%H%M%S).json
          
          # Also keep latest
          aws dynamodb scan \
            --table-name Birthdays \
            --region eu-west-2 \
            --output json > backups/dynamodb/birthdays-latest.json
          
          # Backup WhatsAppGroups table
          aws dynamodb scan \
            --table-name WhatsAppGroups \
            --region eu-west-2 \
            --output json > backups/dynamodb/whatsapp-groups-backup-$(date +%Y%m%d-%H%M%S).json 2>/dev/null || echo "WhatsAppGroups not found"
          
          aws dynamodb scan \
            --table-name WhatsAppGroups \
            --region eu-west-2 \
            --output json > backups/dynamodb/whatsapp-groups-latest.json 2>/dev/null || echo "WhatsAppGroups not found"
          
          # Create metadata
          cat > backups/dynamodb/metadata.json << METADATA
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "tables": ["Birthdays", "WhatsAppGroups"]
          }
          METADATA
          
          echo "✅ DynamoDB backups created"
          ls -lh backups/dynamodb/

      - name: Commit backups to repository
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add backups/dynamodb/*.json
          git diff-index --quiet HEAD || git commit -m "chore(backup): DynamoDB backup $(date +%Y-%m-%d-%H:%M:%S)" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Upload backup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dynamodb-backups
          path: backups/dynamodb/
          retention-days: 90

  summary:
    needs: [test, backup-dynamodb]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "## 🎉 CI/CD Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Jobs Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- DynamoDB Backup: Created and committed to repo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Backups Location" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`backups/dynamodb/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: Available for 90 days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Deploy on Server (192.168.1.66)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cd /opt/whatsapp-birthday-lambda" >> $GITHUB_STEP_SUMMARY
          echo "git pull origin main" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose build" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
